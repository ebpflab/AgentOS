# AgentOS Configuration
# This is the default configuration file for AgentOS.

server:
  host: "0.0.0.0"
  port: 8000
  debug: false

# LLM Provider configurations
providers:
  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    default_model: "gpt-4.1"
    # For Azure OpenAI, set:
    # api_base: "https://your-resource.openai.azure.com/"
    # api_version: "2024-12-01-preview"

  anthropic:
    enabled: true
    api_key: "${ANTHROPIC_API_KEY}"
    default_model: "claude-sonnet-4-6"

  ollama:
    enabled: false
    base_url: "http://localhost:11434"
    default_model: "llama3.2"

# Default provider for new agents
default_provider: "openai"

# Database configuration
database:
  url: "postgresql+asyncpg://agentos:agentos@localhost:5432/agentos"
  pool_size: 20
  max_overflow: 10

# Agent registry
registry:
  # Maximum number of agents allowed
  max_agents: 100

# Resource management
resources:
  # Default token budget per agent (0 = unlimited)
  default_token_budget: 0
  # Default rate limit (requests per minute, 0 = unlimited)
  default_rate_limit: 60
  # Cost tracking
  pricing:
    openai:
      gpt-4.1:
        input_per_1k: 0.002
        output_per_1k: 0.008
      gpt-4.1-mini:
        input_per_1k: 0.0004
        output_per_1k: 0.0016
    anthropic:
      claude-sonnet-4-6:
        input_per_1k: 0.003
        output_per_1k: 0.015
      claude-haiku-4-5:
        input_per_1k: 0.0008
        output_per_1k: 0.004

# Security
security:
  # Enable/disable authentication
  auth_enabled: false
  # OIDC configuration (for SSO)
  oidc:
    issuer_url: ""
    client_id: ""
    client_secret: "${OIDC_CLIENT_SECRET}"
    audience: ""
  # Default tenant for unauthenticated access
  default_tenant: "default"

# Observability
observability:
  # OpenTelemetry
  otlp_endpoint: ""
  # Prometheus metrics
  metrics_enabled: true
  # Structured logging
  log_level: "INFO"
  log_format: "json"

# Agent declarative definitions directory
agents_dir: "configs/agents"
workflows_dir: "configs/workflows"
