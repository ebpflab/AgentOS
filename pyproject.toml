[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
description = "Enterprise Agent Operating System built on Microsoft Agent Framework"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # MAF Core — stable 1.6.0
    "agent-framework>=1.6.0",
    "agent-framework-declarative>=1.0.0b260521",  # pre-release only
    "agent-framework-a2a>=1.0.0b260521",          # pre-release only
    # MAF Providers
    "agent-framework-openai>=1.6.0",
    "agent-framework-anthropic>=1.0.0b260521",    # pre-release only
    "agent-framework-ollama>=1.0.0b260521",       # pre-release only
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    # Config & CLI
    "click>=8.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Observability
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "httpx",
    "ruff>=0.8",
]
devui = [
    "agent-framework-devui>=1.0.0b260521",
]

[project.scripts]
agentos = "agentos.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
